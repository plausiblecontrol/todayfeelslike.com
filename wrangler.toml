name = "today-feels-like"
main = "src/index.js"
compatibility_date = "2024-03-09"

[triggers]
crons = ["20 16 * * *"]

[ai]
binding = "AI"

[observability.logs]
enabled = true
invocation_logs = true

[[routes]]
pattern = "todayfeelslike.com"
custom_domain = true
zone_name = "todayfeelslike.com"

[[kv_namespaces]]
binding = "CONTENT_KV"
id = "TFL_KV_ID"
